spring.application.name=coworkhub

# ===================== BASE DE DATOS (MySQL en Docker) =====================
# Si el puerto 3306 esta ocupado: en docker-compose.yml usa "3307:3306"
# y aqui cambia localhost:3306 por localhost:3307.
spring.datasource.url=jdbc:mysql://localhost:3307/coworkhub?serverTimezone=America/Bogota
spring.datasource.username=coworkhub
spring.datasource.password=coworkhub

# ===================== JPA / HIBERNATE =====================
# "create" borra y crea las tablas en cada arranque y ejecuta import.sql.
# (con update o none, import.sql NO se ejecuta)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================== ACTUATOR =====================
management.endpoints.web.exposure.include=health,info

# ===================== SWAGGER (springdoc) =====================
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===================== PROPIEDADES PROPIAS (se leen con @Value) =====================
app.zona-horaria=America/Bogota
# Vacio = hora real. Para pruebas: app.reloj.fijo=2030-06-03T08:00:00
app.reloj.fijo=

# ===================== SEGURIDAD JWT =====================
# En produccion la clave se pasa con la variable de entorno JWT_SECRETO (minimo 32 caracteres).
app.jwt.secreto=${JWT_SECRETO:coworkhub-clave-secreta-de-desarrollo-2026-con-mas-de-32-caracteres}
app.jwt.expiracion-minutos=60
